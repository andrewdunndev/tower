<svg viewBox="0 0 1200 430" width="1200" height="430" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tower hero: services, watched from outside.">
  <rect x="0" y="0" width="1200" height="430" fill="#f4f4f4"/>
  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <text x="60" y="34" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">CLOUDFLARE WORKER · CRON · D1 · STATUS</text>
  <text x="1140" y="34" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">2026</text>
  <line x1="60" y1="48" x2="1140" y2="48" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="138" font-size="72" font-weight="700" fill="#4a6741" letter-spacing="-2">tower</text>
  <text x="60" y="172" font-size="14" fill="#404040">Checks each service from outside every minute,</text>
  <text x="60" y="192" font-size="14" fill="#404040">keeps 90 days of history and mails the operator on a change.</text>
  <text x="60" y="222" font-size="12" font-style="italic" fill="#404040">a light on the hill, not a dashboard</text>
  <g transform="translate(110 240) scale(2.2)">
  <g stroke="#4a6741" fill="none" stroke-linecap="round">
    <rect x="32" y="16" width="22" height="32" stroke-width="1.8" rx="1"/>
    <line x1="8" y1="40" x2="32" y2="32" stroke-width="2"/>
    <line x1="36" y1="22" x2="50" y2="22" stroke-width="1"/>
    <line x1="36" y1="30" x2="50" y2="30" stroke-width="1"/>
    <line x1="36" y1="38" x2="46" y2="38" stroke-width="1"/>
  </g>
  <circle cx="8" cy="40" r="2.5" fill="#4a6741"/>
  </g>
  <text x="560" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">FLOW</text>
  <text x="850" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">DISCIPLINE</text>
  <rect x="560" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">IN</text>
  <text x="578" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">probe</text>
  <text x="578" y="178" font-size="11" fill="#404040">200 from the origin, never from cache</text>
  <text x="578" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">EVERY MINUTE</text>
  <rect x="850" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">POSTURE</text>
  <text x="868" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">settle</text>
  <text x="868" y="178" font-size="11" fill="#404040">down after 3 failures, up after 2 passes</text>
  <text x="868" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">NO FLAPPING</text>
  <rect x="560" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">OUT</text>
  <text x="578" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">keep</text>
  <text x="578" y="318" font-size="11" fill="#404040">daily uptime and every change, in D1</text>
  <text x="578" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">90 DAYS</text>
  <rect x="850" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">LIFETIME</text>
  <text x="868" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">tell</text>
  <text x="868" y="318" font-size="11" fill="#404040">one mail to the operator per change</text>
  <text x="868" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">SEND_EMAIL</text>
  <line x1="60" y1="386" x2="1140" y2="386" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="412" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">WORKERS PAID · D1 · SEND_EMAIL · NAMES ONLY</text>
  <text x="1140" y="412" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">GITLAB.COM/DUNN.DEV/TOWER</text>
  </g>
</svg>
