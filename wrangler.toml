name = "tower"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# [[routes]]
# pattern = "status.example.com"
# custom_domain = true
# zone_name = "example.com"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tower"
migrations_dir = "migrations"

[assets]
directory = "./public"

# [vars]
# ALERT_FROM = "alerts@example.com"
# ALERT_TO = "you@example.com"

# [[send_email]]
# name = "ALERT"
# destination_address = "you@example.com"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
