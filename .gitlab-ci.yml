default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - verdict
  - build
  - deploy
  - automerge-gate

include:
  - component: gitlab.com/dunn.dev/pipeline/reference-check@4.17.0
    inputs:
      reference_ref: main
      fail_on_violation: true
  - component: gitlab.com/dunn.dev/pipeline/cloudflare-worker@4.17.0
    inputs:
      wrangler_config: site/wrangler.toml
      build_command: npm run build
      output_dir: site/dist
      needs_npm_install: true
      npm_dir: site
      production_url: https://tower.dunn.dev
  - component: gitlab.com/dunn.dev/pipeline/osv-verdict@4.17.0
  - component: gitlab.com/dunn.dev/pipeline/secret-verdict@4.17.0
  - component: gitlab.com/dunn.dev/pipeline/pin-audit@4.17.0
  - component: gitlab.com/dunn.dev/pipeline/automerge-gate@4.17.0
    inputs:
      stage: automerge-gate
      required-checks: "osv,secret"

.node:
  image: node:26.13.1@sha256:f8e5d4bb28fa55c74f1345166a082a10b7c68f22304350c1ce0d18358ae94996
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - npm ci --ignore-scripts --prefer-offline

test:
  extends: .node
  stage: test
  cache:
    policy: pull-push
  script:
    - npm run check

worker-dry-run:
  extends: .node
  stage: build
  needs: []
  script:
    - WRANGLER_SEND_METRICS=false npm run deploy -- example --dry-run

lab:
  extends: .node
  stage: test
  script:
    - bash scripts/lab.sh
