default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - build
  - deploy

include:
  - component: gitlab.com/dunn.dev/pipeline/reference-check@4.10.0
    inputs:
      reference_ref: main
      fail_on_violation: true
  - component: gitlab.com/dunn.dev/pipeline/cloudflare-worker@4.10.0
    inputs:
      wrangler_config: site/wrangler.toml
      build_command: npm run build
      output_dir: site/dist
      needs_npm_install: true
      npm_dir: site
      production_url: https://tower.dunn.dev

test:
  stage: test
  image: node:24.21.0@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
  script:
    - npm ci --ignore-scripts
    - npm run check
