default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - build
  - deploy

include:
  - component: gitlab.com/dunn.dev/pipeline/reference-check@4.10.0
    inputs:
      reference_ref: main
      fail_on_violation: true
  - component: gitlab.com/dunn.dev/pipeline/cloudflare-worker@4.10.0
    inputs:
      wrangler_config: site/wrangler.toml
      build_command: npm run build
      output_dir: site/dist
      needs_npm_install: true
      npm_dir: site
      production_url: https://tower.dunn.dev

.node:
  image: node:24.21.0@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - npm ci --ignore-scripts --prefer-offline

test:
  extends: .node
  stage: test
  cache:
    policy: pull-push
  script:
    - npm run check

worker-dry-run:
  extends: .node
  stage: build
  needs: []
  script:
    - WRANGLER_SEND_METRICS=false npm run deploy -- example --dry-run
