default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - verdict
  - build
  - deploy
  - automerge-gate

include:
  - component: gitlab.com/dunn.dev/pipeline/reference-check@4.16.0
    inputs:
      reference_ref: main
      fail_on_violation: true
  - component: gitlab.com/dunn.dev/pipeline/cloudflare-worker@4.16.0
    inputs:
      wrangler_config: site/wrangler.toml
      build_command: npm run build
      output_dir: site/dist
      needs_npm_install: true
      npm_dir: site
      production_url: https://tower.dunn.dev
  - component: gitlab.com/dunn.dev/pipeline/osv-verdict@4.16.0
  - component: gitlab.com/dunn.dev/pipeline/secret-verdict@4.16.0
  - component: gitlab.com/dunn.dev/pipeline/pin-audit@4.16.0
  - component: gitlab.com/dunn.dev/pipeline/automerge-gate@4.16.0
    inputs:
      stage: automerge-gate
      required-checks: "osv,secret"

.node:
  image: node:26.13.1@sha256:e18c3ccdf7d71619990b0e85639f506e2028a95410999cab24cc373cbd10e0ac
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull
  before_script:
    - npm ci --ignore-scripts --prefer-offline

test:
  extends: .node
  stage: test
  cache:
    policy: pull-push
  script:
    - npm run check

worker-dry-run:
  extends: .node
  stage: build
  needs: []
  script:
    - WRANGLER_SEND_METRICS=false npm run deploy -- example --dry-run

lab:
  extends: .node
  stage: test
  script:
    - bash scripts/lab.sh

page-visual:
  extends: .node
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - page/**/*
        - test/visual/**/*
        - test/fixture/**/*
        - tools/stage.ts
        - .gitlab-ci.yml
        - package.json
        - package-lock.json
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node tools/stage.ts test/fixture
    - npm run build -w page
    - node_modules/.bin/playwright test -c test/visual
